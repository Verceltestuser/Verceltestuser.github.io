<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiragana Test</title>
    <link rel="stylesheet" href="css/game.css" />
</head>
<body class="container">
    <div class="header"><h1 id="ui-title">Hiragana / Katakana Test</h1></div>

    <div class="word-display">あ</div>
    <div class="word-input-box"><input type="text" class="word-input" /></div>
    
    <div class="game-info">
        <div><span id="ui-time-label">Time left</span> : <span class="time">0</span> <span id="ui-sec-label">sec.</span></div>
        <div><span id="ui-score-label">Score</span> : <span class="score">0</span> <span id="ui-point-label">point</span></div>
    </div>
    <button class="button" onclick="run()">Game Start</button>
    <select id="langSelect">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="ar">العربية</option>
        <option value="ko">한국어</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
    </select>
    <script src="js/game.js"></script>
</body>
</html>
